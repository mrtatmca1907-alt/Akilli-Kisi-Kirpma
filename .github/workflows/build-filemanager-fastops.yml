name: Build ATMACA Dosyalar FastOps

on:
  workflow_dispatch:
  push:
    branches: [ atmaca-dosyalar-fastops-v2 ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test
        run: gradle :filemanagerapp:testDebugUnitTest --stacktrace
      - name: Build APK
        run: gradle :filemanagerapp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ATMACA-Dosyalar-FastOps-v2
          path: filemanagerapp/build/outputs/apk/debug/filemanagerapp-debug.apk
          if-no-files-found: error
