name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: API 35 kur
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Kisi kirpma modelini indir
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            "https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/object_detection/android/lite-model_efficientdet_lite0_detection_metadata_1.tflite" \
            -o app/src/main/assets/efficientdet-lite0.tflite
          test -s app/src/main/assets/efficientdet-lite0.tflite

      - name: Gradle 8.11.1 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Uc APKyi derle
        run: gradle :app:assembleDebug :videoapp:assembleDebug :downloaderapp:assembleDebug --stacktrace

      - name: Kisi Kirpma APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: Akilli-Kisi-Kirpma-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Video Kareleri APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: VideoKareleri-APK
          path: videoapp/build/outputs/apk/debug/videoapp-debug.apk
          if-no-files-found: error

      - name: Coklu Video Indirici APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: Coklu-Video-Indirici-APK
          path: downloaderapp/build/outputs/apk/debug/downloaderapp-debug.apk
          if-no-files-found: error
