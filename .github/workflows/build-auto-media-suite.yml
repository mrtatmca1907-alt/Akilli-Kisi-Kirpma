name: Build ATMACA Auto Media Suite

on:
  workflow_dispatch:
  push:
    branches:
      - feature/auto-media-suite

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK lisanslarini kabul et
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: API 35 kur
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Kisi kirpma modelini indir
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            "https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/object_detection/android/lite-model_efficientdet_lite0_detection_metadata_1.tflite" \
            -o app/src/main/assets/efficientdet-lite0.tflite
          test -s app/src/main/assets/efficientdet-lite0.tflite

      - name: Gradle 8.11.1 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Suite testleri
        run: gradle :suiteapp:testDebugUnitTest --stacktrace

      - name: Suite APK derle
        run: gradle :suiteapp:assembleDebug --stacktrace

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: ATMACA-Auto-Media-v0.3-lossless
          path: suiteapp/build/outputs/apk/debug/suiteapp-debug.apk
          if-no-files-found: error
