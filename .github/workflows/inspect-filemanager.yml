name: Inspect File Manager APK

on:
  push:
    branches: [ filemanager-patch ]
    paths:
      - '.github/workflows/inspect-filemanager.yml'
      - 'tools/filemanager/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Download exact upstream APK
        run: |
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/filemanager.apk 'https://d.apkpure.net/b/APK/com.alphainventor.filemanager?version=latest'
          echo '2528b7ac9e2ada91c17f5a853dd4d0ec8556354dd578e647a1caba0c69a547cb  /tmp/filemanager.apk' | sha256sum -c -

      - name: Decompile APK
        run: |
          apktool d -f /tmp/filemanager.apk -o /tmp/apktool-out

      - name: Build focused report
        run: |
          mkdir -p tools/filemanager
          python3 - <<'PY'
          import os,re
          roots=[p for p in os.listdir('/tmp/apktool-out') if p.startswith('smali')]
          pats=[
            r'Recycle Bin',r'RecycleBin',r'DeleteOperator',r'DELETE TO RECYCLE',r'CREATE RECYCLE BIN',
            r'\.nomedia',r'MediaScanner',r'renameTo',r'Files;->move',r'mkdirs?',r'calculate',r'folder size'
          ]
          rx=re.compile('|'.join(pats),re.I)
          out=[]
          for root in roots:
            base='/tmp/apktool-out/'+root
            for dp,_,fs in os.walk(base):
              for fn in fs:
                if not fn.endswith('.smali'): continue
                p=os.path.join(dp,fn)
                try: lines=open(p,'r',errors='ignore').read().splitlines()
                except: continue
                hits=[i for i,l in enumerate(lines) if rx.search(l)]
                if not hits: continue
                out.append('\n===== '+p+' =====')
                seen=set()
                for i in hits[:30]:
                  a=max(0,i-12); b=min(len(lines),i+18)
                  key=(a,b)
                  if key in seen: continue
                  seen.add(key)
                  out.extend(f'{n+1:06d}: {lines[n]}' for n in range(a,b))
          open('tools/filemanager/inspection-report.txt','w').write('\n'.join(out[:30000]))
          print('report lines',min(len(out),30000))
          PY

      - name: Commit report
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tools/filemanager/inspection-report.txt
          git diff --cached --quiet || git commit -m 'Add File Manager smali inspection report'
          git push
