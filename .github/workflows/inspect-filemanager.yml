name: Inspect File Manager APK

on:
  push:
    branches: [ filemanager-patch ]
    paths:
      - '.github/workflows/inspect-filemanager.yml'
      - 'tools/filemanager/**'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip
          curl -L --fail --retry 3 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          echo "/tmp/jadx/bin" >> "$GITHUB_PATH"

      - name: Download exact upstream APK
        run: |
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/filemanager.apk 'https://d.apkpure.net/b/APK/com.alphainventor.filemanager?version=latest'
          echo '2528b7ac9e2ada91c17f5a853dd4d0ec8556354dd578e647a1caba0c69a547cb  /tmp/filemanager.apk' | sha256sum -c -
          ls -lh /tmp/filemanager.apk

      - name: Decompile resources and smali
        run: |
          apktool d -f /tmp/filemanager.apk -o /tmp/apktool-out >/tmp/apktool.log 2>&1
          tail -n 80 /tmp/apktool.log

      - name: Decompile Java view
        run: |
          jadx -d /tmp/jadx-out /tmp/filemanager.apk >/tmp/jadx.log 2>&1 || true
          tail -n 80 /tmp/jadx.log

      - name: Locate file operation code
        run: |
          mkdir -p out
          {
            echo '=== JAVA MATCHES ==='
            grep -RniE 'Recycle Bin|RecycleBin|DeleteOperator|DELETE TO RECYCLE|CREATE RECYCLE BIN|\.nomedia|MediaScanner|renameTo\(|Files\.move|mkdirs?\(' /tmp/jadx-out/sources 2>/dev/null | head -n 1000 || true
            echo
            echo '=== SMALI MATCHES ==='
            grep -RniE 'Recycle Bin|RecycleBin|DeleteOperator|DELETE TO RECYCLE|CREATE RECYCLE BIN|\.nomedia|MediaScanner|renameTo|Files;->move|mkdirs?' /tmp/apktool-out/smali* 2>/dev/null | head -n 1500 || true
          } | tee out/file-ops-matches.txt

      - name: Collect matching source files
        run: |
          python3 - <<'PY'
          import os,re,shutil
          roots=['/tmp/jadx-out/sources','/tmp/apktool-out']
          pat=re.compile(r'Recycle Bin|RecycleBin|DeleteOperator|DELETE TO RECYCLE|CREATE RECYCLE BIN|\.nomedia|MediaScanner|renameTo\(|Files\.move|mkdirs?\(',re.I)
          out='out/matches'
          os.makedirs(out,exist_ok=True)
          count=0
          for root in roots:
            for dp,_,fs in os.walk(root):
              for f in fs:
                if not f.endswith(('.java','.smali','.xml')): continue
                p=os.path.join(dp,f)
                try:
                  s=open(p,'r',errors='ignore').read()
                except: continue
                if pat.search(s):
                  rel=p.replace('/tmp/','').replace('/','__')
                  shutil.copy2(p,os.path.join(out,rel))
                  count+=1
                  if count>=300: break
              if count>=300: break
            if count>=300: break
          print('collected',count)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: filemanager-inspection
          path: out
          retention-days: 3
