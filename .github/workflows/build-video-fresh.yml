name: Build Video Kareleri Fresh APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'freshvideo/**'
      - 'settings.gradle.kts'
      - '.github/workflows/build-video-fresh.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK\n        env:\n          ANDROID_HOME: /usr/local/lib/android/sdk\n          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk\n        run: |\n          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses\n          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build fresh APK
        run: gradle :freshvideo:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Kareleri-Yeni-1.0.0
          path: freshvideo/build/outputs/apk/debug/freshvideo-debug.apk
          if-no-files-found: error
