name: Extract Focused Move Methods
on:
  push:
    branches: [ filemanager-patch ]
    paths: [ '.github/workflows/extract-hot-methods.yml' ]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate focused report after syncing branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin filemanager-patch
          git reset --hard origin/filemanager-patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          files={
            'e':'tools/filemanager/move/sources/smali__ax__Z2__e.smali',
            'ej':'tools/filemanager/move/sources/smali__ax__Z2__e$j.smali',
            'x':'tools/filemanager/move/sources/smali__com__alphainventor__filemanager__file__x.smali',
            'n':'tools/filemanager/move/sources/smali__ax__Z2__n$b.smali',
          }
          out=[]
          for key,path in files.items():
            s=Path(path).read_text(errors='ignore')
            for m in re.finditer(r'(?ms)^\.method .*?^\.end method\s*',s):
              body=m.group(0)
              sig=body.splitlines()[0]
              want=False
              if key=='e' and (' k2(' in sig or ' t1(' in sig): want=True
              if key=='ej' and (' P(' in sig or ' Q(' in sig or 'MOVE FILE COUNT NOT MATCH' in body): want=True
              if key=='x' and (' i1(' in sig or 'Files;->move' in body or 'renameTo' in body): want=True
              if key=='n' and ('.nomedia' in body or 'MediaScanner' in body): want=True
              if want:
                out.append(f'===== {path}\n{sig} =====\n{body}')
          Path('tools/filemanager/move/focused-methods.txt').write_text('\n'.join(out))
          print('extracted',len(out),'methods')
          PY
          git add tools/filemanager/move/focused-methods.txt
          git diff --cached --quiet || git commit -m 'Add focused move method report'
          git push origin HEAD:filemanager-patch
