name: Inspect Move Hot Paths
on:
  push:
    branches: [ filemanager-patch ]
    paths: [ '.github/workflows/inspect-move.yml' ]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y apktool
      - run: |
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/a.apk 'https://d.apkpure.net/b/APK/com.alphainventor.filemanager?version=latest'
          echo '2528b7ac9e2ada91c17f5a853dd4d0ec8556354dd578e647a1caba0c69a547cb  /tmp/a.apk' | sha256sum -c -
          apktool d -f /tmp/a.apk -o /tmp/a >/dev/null
      - name: Map move scan size paths
        run: |
          mkdir -p /tmp/report-out/sources
          python3 - <<'PY'
          import os,shutil
          needles=['File.renameTo failed','Files.move failed','Create folder failed in move directory','MoveOperator','MOVE FILE','MOVE DIRECTORY','MediaScannerConnection','SCAN AFTER','folder size','CALCULATE SIZE']
          out=[]
          hitfiles=[]
          for root,_,fs in os.walk('/tmp/a'):
            for fn in fs:
              if not fn.endswith('.smali'): continue
              p=os.path.join(root,fn)
              try: lines=open(p,errors='ignore').read().splitlines()
              except: continue
              matched=False
              for i,l in enumerate(lines):
                if not any(n.lower() in l.lower() for n in needles): continue
                matched=True
                m=''
                for j in range(i,-1,-1):
                  if lines[j].startswith('.method '): m=lines[j]; break
                out.append(f'FILE {os.path.relpath(p,"/tmp/a")}\nMETHOD {m}\nHIT {i+1}: {l}')
                a=max(0,i-25); b=min(len(lines),i+45)
                out.extend(f'{k+1:06d}: {lines[k]}' for k in range(a,b))
                out.append('---')
              if matched: hitfiles.append(p)
          open('/tmp/report-out/report.txt','w').write('\n'.join(out[:40000]))
          # Always retain the exact move implementation/factory and storage backend.
          extra=['/tmp/a/smali/ax/Z2/e.smali','/tmp/a/smali/ax/Z2/e$j.smali','/tmp/a/smali/com/alphainventor/filemanager/file/x.smali']
          for p in dict.fromkeys(hitfiles+extra):
            if os.path.exists(p): shutil.copy2(p,'/tmp/report-out/sources/'+os.path.relpath(p,'/tmp/a').replace('/','__'))
          print('hits',sum(1 for x in out if x.startswith('FILE ')),'files',len(hitfiles))
          PY
      - name: Commit report without losing concurrent branch updates
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin filemanager-patch
          git reset --hard origin/filemanager-patch
          rm -rf tools/filemanager/move/sources
          mkdir -p tools/filemanager/move/sources
          cp /tmp/report-out/report.txt tools/filemanager/move/report.txt
          cp /tmp/report-out/sources/* tools/filemanager/move/sources/ || true
          git add tools/filemanager/move
          git diff --cached --quiet || git commit -m 'Collect full move operator sources'
          git push origin HEAD:filemanager-patch
