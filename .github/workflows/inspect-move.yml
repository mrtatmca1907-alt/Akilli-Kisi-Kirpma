name: Inspect Move Hot Paths
on:
  push:
    branches: [ filemanager-patch ]
    paths: [ '.github/workflows/inspect-move.yml' ]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y apktool
      - run: |
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/a.apk 'https://d.apkpure.net/b/APK/com.alphainventor.filemanager?version=latest'
          echo '2528b7ac9e2ada91c17f5a853dd4d0ec8556354dd578e647a1caba0c69a547cb  /tmp/a.apk' | sha256sum -c -
          apktool d -f /tmp/a.apk -o /tmp/a >/dev/null
      - name: Extract exact hot methods
        run: |
          mkdir -p /tmp/report-out
          python3 - <<'PY'
          import os,re
          needles=[
            'Lj$/nio/file/Files;->move','Ljava/io/File;->renameTo','MOVE FILE COUNT NOT MATCH',
            'MediaScannerConnection','ScanService','.nomedia','Create folder failed in move directory'
          ]
          interesting=[]
          wanted_prefixes=('smali/ax/Z2/e','smali/com/alphainventor/filemanager/file/J','smali/com/alphainventor/filemanager/file/x','smali/com/alphainventor/filemanager/file/o','smali/com/alphainventor/filemanager/service/ScanService')
          for root,_,fs in os.walk('/tmp/a'):
            for fn in fs:
              if not fn.endswith('.smali'): continue
              p=os.path.join(root,fn); rel=os.path.relpath(p,'/tmp/a')
              if not rel.startswith(wanted_prefixes): continue
              try: s=open(p,errors='ignore').read()
              except: continue
              # Split complete methods so context is never ambiguous.
              for m in re.finditer(r'(?ms)^\.method .*?^\.end method\s*',s):
                body=m.group(0)
                if any(n in body for n in needles) or (rel.endswith('e$j.smali') and '->P(' in body):
                  sig=body.splitlines()[0]
                  interesting.append(f'===== {rel}\n{sig} =====\n{body}')
          open('/tmp/report-out/method-report.txt','w').write('\n'.join(interesting))
          print('methods',len(interesting))
          PY
      - name: Commit method report race-safe
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin filemanager-patch
          git reset --hard origin/filemanager-patch
          mkdir -p tools/filemanager/move
          cp /tmp/report-out/method-report.txt tools/filemanager/move/method-report.txt
          git add tools/filemanager/move/method-report.txt
          git diff --cached --quiet || git commit -m 'Extract exact File Manager move hot methods'
          git push origin HEAD:filemanager-patch
