name: Build ATMACA 50 APK

on:
  push:
    branches: [ atmaca50-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :batchapp:testDebugUnitTest --stacktrace
      - run: gradle :batchapp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ATMACA-50-v1.3.1-NOMEDIA-FIX
          path: batchapp/build/outputs/apk/debug/batchapp-debug.apk
          if-no-files-found: error
