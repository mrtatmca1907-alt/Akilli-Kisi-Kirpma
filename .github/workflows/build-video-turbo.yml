name: Build Separate Video APK

on:
  workflow_dispatch:
  push:
    branches: [ feature/auto-media-suite ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu al
        uses: actions/checkout@v5
      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK lisanslarini kabul et
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: API 35 kur
        shell: bash
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Gradle 8.11.1 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test
        run: gradle :videoapp:testDebugUnitTest --stacktrace
      - name: APK derle
        run: gradle :videoapp:assembleDebug --stacktrace
      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: ATMACA-Video-Kareleri-Ayri
          path: videoapp/build/outputs/apk/debug/videoapp-debug.apk
          if-no-files-found: error
